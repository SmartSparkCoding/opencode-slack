<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OpenCode Slack Bot</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0d1117; color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .card {
    background: #161b22; border: 1px solid #30363d; border-radius: 8px;
    padding: 28px; width: 320px; text-align: center;
  }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p { color: #8b949e; font-size: 13px; margin: 0 0 18px; }
  input {
    width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #30363d;
    background: #010409; color: #e6edf3; font-size: 18px; text-align: center; letter-spacing: 4px;
  }
  input:focus { outline: none; border-color: #58a6ff; }
  button {
    width: 100%; margin-top: 12px; padding: 10px; border: none; border-radius: 6px;
    background: #3fb950; color: #0d1117; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #2ea043; }
  .err { color: #f85149; font-size: 13px; margin-top: 10px; min-height: 18px; }
</style>
</head>
<body>
  <div class="card">
    <h1>OpenCode Slack Bot</h1>
    <p>Enter your PIN to continue</p>
    <form id="f">
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••" autofocus />
      <button type="submit">Unlock</button>
    </form>
    <div class="err" id="err"></div>
  </div>
<script>
const f = document.getElementById("f")
const pin = document.getElementById("pin")
const err = document.getElementById("err")
f.addEventListener("submit", async (e) => {
  e.preventDefault()
  err.textContent = ""
  try {
    const r = await fetch("/api/login", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ pin: pin.value }),
    })
    if (r.ok) {
      window.location.href = "/"
    } else {
      err.textContent = "Wrong PIN — try again"
      pin.value = ""
      pin.focus()
    }
  } catch {
    err.textContent = "Request failed"
  }
})
</script>
</body>
</html>
